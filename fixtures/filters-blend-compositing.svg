<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64">
<defs>
 <filter id="hue" color-interpolation-filters="sRGB"><feFlood flood-color="#48c" flood-opacity=".6" result="bg"/><feBlend in="SourceGraphic" in2="bg" mode="hue"/></filter>
 <filter id="soft" color-interpolation-filters="sRGB"><feFlood flood-color="#48c" flood-opacity=".6" result="bg"/><feBlend in="SourceGraphic" in2="bg" mode="soft-light"/></filter>
 <filter id="burn"><feFlood flood-color="#8c4" flood-opacity=".6" result="bg"/><feBlend in="SourceGraphic" in2="bg" mode="color-burn"/></filter>
 <filter id="overlay"><feFlood flood-color="#48c" flood-opacity=".6" result="bg"/><feBlend in="SourceGraphic" in2="bg" mode="overlay"/></filter>
 <clipPath id="cut"><rect x="4" y="38" width="24" height="16" rx="4"/></clipPath>
 <mask id="fade"><rect width="64" height="64" fill="white"/><circle cx="51" cy="48" r="5" fill="#888"/></mask>
</defs>
<circle cx="16" cy="16" r="10" fill="#d64" fill-opacity=".7" filter="url(#hue)"/>
<circle cx="48" cy="16" r="10" fill="#d64" fill-opacity=".7" filter="url(#soft)"/>
<g opacity=".8"><circle cx="16" cy="48" r="10" fill="#d64" fill-opacity=".7" filter="url(#burn)" clip-path="url(#cut)"/></g>
<circle cx="48" cy="48" r="10" fill="#d64" fill-opacity=".7" filter="url(#overlay)" mask="url(#fade)"/>
</svg>
