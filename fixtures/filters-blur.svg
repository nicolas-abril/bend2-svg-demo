<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64">
<defs>
 <filter id="blur" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="1.5"/></filter>
 <filter id="srgb" x="-70%" y="-70%" width="240%" height="240%" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="1.5"/></filter>
 <filter id="xy" x="-.8" y="-.8" width="2.6" height="2.6"><feGaussianBlur stdDeviation="2 .6"/></filter>
 <filter id="shadow" x="-.6" y="-.6" width="2.2" height="2.2"><feGaussianBlur in="SourceAlpha" stdDeviation="1.3"/><feOffset dx="2" dy="3" result="shade"/><feFlood flood-color="#257" flood-opacity=".8"/><feComposite in2="shade" operator="in"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<g filter="url(#blur)"><rect x="7" y="7" width="8" height="15" fill="red"/><rect x="15" y="7" width="8" height="15" fill="lime"/></g>
<g filter="url(#srgb)"><rect x="39" y="7" width="8" height="15" fill="red"/><rect x="47" y="7" width="8" height="15" fill="lime"/></g>
<rect x="8" y="40" width="15" height="12" fill="#d45" filter="url(#xy)"/>
<circle cx="46" cy="45" r="8" fill="#fd5" filter="url(#shadow)"/>
</svg>
