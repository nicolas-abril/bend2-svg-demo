<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64">
<defs>
 <filter id="blur" x="-.7" y="-.7" width="2.4" height="2.4"><feGaussianBlur stdDeviation="1.5 .6"/></filter>
 <filter id="box" primitiveUnits="objectBoundingBox" x="-.5" y="-.5" width="2" height="2"><feGaussianBlur stdDeviation=".08 .15"/><feOffset dx=".1" dy=".05"/></filter>
 <filter id="shadow" x="-.7" y="-.7" width="2.4" height="2.4"><feDropShadow dx="2" dy="2" stdDeviation="1.2" flood-color="#247" flood-opacity=".8"/></filter>
</defs>
<g transform="translate(16 15) rotate(25)"><rect x="-8" y="-5" width="16" height="10" fill="#e53" filter="url(#blur)"/></g>
<g transform="translate(45 15) skewX(25) scale(.9 1.2)"><rect x="-8" y="-5" width="16" height="10" fill="#39d" filter="url(#blur)"/></g>
<rect x="7" y="38" width="18" height="13" fill="#49a" filter="url(#box)"/>
<g transform="translate(46 45) rotate(-18)"><rect x="-8" y="-6" width="16" height="12" rx="2" fill="#fc4" filter="url(#shadow)"/></g>
</svg>
